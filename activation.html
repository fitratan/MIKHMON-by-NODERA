<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aktivasi Lisensi — Mikhmon Desktop by NODERA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-app-region: drag;
    }
    .no-drag {
      -webkit-app-region: no-drag;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="bg-[#0B132B] text-white flex items-center justify-center min-h-screen p-6 overflow-hidden">
  <div class="w-full max-w-md bg-[#131E3D] border border-blue-900/50 rounded-2xl p-7 shadow-2xl space-y-6 relative">
    
    <!-- Header with Branding -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-[#0073C6] to-cyan-500 shadow-lg shadow-blue-500/20 mb-1">
        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/>
        </svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Mikhmon Desktop</h1>
      <p class="text-xs text-blue-300/80 font-medium">by PT Nodera Digital Network</p>
    </div>

    <!-- Status Alert Box -->
    <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-medium border transition-all"></div>

    <!-- Activation Form -->
    <form id="activationForm" class="space-y-4 no-drag">
      <div>
        <label class="block text-xs font-semibold text-blue-200 mb-1.5 uppercase tracking-wider">
          NODERA License Key
        </label>
        <input 
          type="text" 
          id="licenseKeyInput" 
          placeholder="NDR-MKH-XXXX-XXXX-XXXX-XXXX"
          required
          autocomplete="off"
          spellcheck="false"
          class="w-full px-4 py-3 bg-[#0B132B] border border-blue-800/80 rounded-xl text-sm font-semibold tracking-wider text-cyan-300 placeholder-blue-600 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 tabular-nums uppercase transition-all"
        />
        <p class="text-[11px] text-blue-300/60 mt-1">
          Masukkan 20+ karakter key lisensi resmi yang terdaftar di Cloud Panel.
        </p>
      </div>

      <!-- Hardware ID Box -->
      <div class="bg-[#0B132B]/80 border border-blue-900/60 rounded-xl p-3 space-y-1">
        <div class="flex items-center justify-between text-xs">
          <span class="text-blue-300/70">Hardware ID (HWID):</span>
          <button 
            type="button" 
            id="copyHwidBtn"
            class="text-[11px] font-semibold text-cyan-400 hover:text-cyan-300 transition-colors flex items-center gap-1"
          >
            <span>Salin</span>
          </button>
        </div>
        <div id="hwidDisplay" class="font-mono text-xs text-blue-200 truncate select-all">
          Memuat HWID...
        </div>
      </div>

      <!-- Action Button -->
      <button 
        type="submit" 
        id="submitBtn"
        class="w-full py-3.5 px-4 bg-gradient-to-r from-[#0073C6] to-cyan-600 hover:from-[#0062A8] hover:to-cyan-500 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all flex items-center justify-center gap-2"
      >
        <span id="btnText">Aktivasi Lisensi Sekarang</span>
        <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="10" stroke-width="4" class="opacity-25"></circle>
          <path fill="currentColor" d="M4 12a8 8 0 018-8v8H4z" class="opacity-75"></path>
        </svg>
      </button>
    </form>

    <!-- Footer Links -->
    <div class="text-center pt-2 border-t border-blue-900/40 no-drag space-y-2">
      <p class="text-xs text-blue-300/60">
        Belum memiliki License Key aktif?
      </p>
      <div class="flex items-center justify-center gap-4 text-xs font-semibold text-cyan-400">
        <a href="#" id="buyLink" class="hover:text-cyan-300 hover:underline transition-colors">
          Beli Lisensi di Cloud Panel &rarr;
        </a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('activationForm');
    const input = document.getElementById('licenseKeyInput');
    const hwidDisplay = document.getElementById('hwidDisplay');
    const copyHwidBtn = document.getElementById('copyHwidBtn');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const alertBox = document.getElementById('alertBox');
    const buyLink = document.getElementById('buyLink');

    let currentHwid = '';

    // Load HWID on start
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        if (window.noderaDesktop) {
          currentHwid = await window.noderaDesktop.getHwid();
          hwidDisplay.textContent = currentHwid || 'HWID-STANDALONE-PC';
        }
      } catch (err) {
        hwidDisplay.textContent = 'ERROR-GET-HWID';
      }
    });

    // Copy HWID
    copyHwidBtn.addEventListener('click', () => {
      if (currentHwid) {
        navigator.clipboard.writeText(currentHwid);
        copyHwidBtn.innerHTML = '<span class="text-emerald-400">Tersalin!</span>';
        setTimeout(() => {
          copyHwidBtn.innerHTML = '<span>Salin</span>';
        }, 2000);
      }
    });

    // Open Buy Link
    buyLink.addEventListener('click', (e) => {
      e.preventDefault();
      if (window.noderaDesktop) {
        window.noderaDesktop.openExternal('https://dgtlnetsolution.com');
      }
    });

    // Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const key = input.value.trim().toUpperCase();
      if (!key) return;

      submitBtn.disabled = true;
      spinner.classList.remove('hidden');
      btnText.textContent = 'Memverifikasi...';
      alertBox.classList.add('hidden');

      try {
        if (window.noderaDesktop) {
          const res = await window.noderaDesktop.activateLicense(key);
          if (res.success) {
            alertBox.className = 'p-3.5 rounded-xl text-xs font-semibold bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 block';
            alertBox.textContent = 'Aktivasi berhasil! Membuka Mikhmon...';
            setTimeout(() => {
              // Main process will redirect window to Mikhmon app
            }, 1000);
          } else {
            alertBox.className = 'p-3.5 rounded-xl text-xs font-semibold bg-rose-950/80 border border-rose-500/50 text-rose-300 block';
            alertBox.textContent = res.message || 'Aktivasi gagal. Periksa kembali license key Anda.';
            submitBtn.disabled = false;
            spinner.classList.add('hidden');
            btnText.textContent = 'Aktivasi Lisensi Sekarang';
          }
        }
      } catch (err) {
        alertBox.className = 'p-3.5 rounded-xl text-xs font-semibold bg-rose-950/80 border border-rose-500/50 text-rose-300 block';
        alertBox.textContent = 'Gagal menghubungi server lisensi NODERA. Pastikan koneksi internet aktif.';
        submitBtn.disabled = false;
        spinner.classList.add('hidden');
        btnText.textContent = 'Aktivasi Lisensi Sekarang';
      }
    });
  </script>
</body>
</html>
